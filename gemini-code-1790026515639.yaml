name: Build plugin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: RotatingLeaderboard
          path: target/RotatingLeaderboard-1.0-SNAPSHOT.jar